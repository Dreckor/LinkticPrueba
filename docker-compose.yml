services:
  productos:
    container_name: productos
    build:
      context: ./productos
      dockerfile: Dockerfile
    image: productos-service:1.0.0
    ports:
      - "8081:8080" 
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/productos_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - postgres_db

  inventario:
    container_name: inventario
    build:
      context: ./inventario
      dockerfile: Dockerfile
    image: inventario-service:1.0.0
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/inventario_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - postgres_db

  postgres_db:
    container_name: postgres_db
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql